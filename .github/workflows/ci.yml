name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: pixel-ntfy

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: test-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Build (syntax check)
        run: npm run build

      - name: Test with coverage
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-output.log

      - name: Reject skipped tests
        run: |
          if grep -Eq '(^ℹ (skipped|todo) [1-9])|(^# (SKIP|TODO))' test-output.log; then
            echo "::error::Tests were skipped; install the missing tool or fix the test."
            grep -E '(^ℹ (skipped|todo) [1-9])|(^# (SKIP|TODO))' test-output.log
            exit 1
          fi
          grep -q '^ℹ pass [1-9][0-9]*$' test-output.log
          grep -q '^ℹ fail 0$' test-output.log

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: pixelntfy:ci
          cache-from: type=gha,scope=pixelntfy-test
          cache-to: type=gha,mode=max,scope=pixelntfy-test

      - name: Smoke production image
        run: bash scripts/smoke-image.sh pixelntfy:ci

  publish:
    name: publish
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-pixelntfy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: images
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.images.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pixelntfy-publish
          cache-to: type=gha,mode=max,scope=pixelntfy-publish

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.images.outputs.tags }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "no image digest" >&2; exit 1; }
          printf 'image digest: %s\n' "$DIGEST" | tee image-digest.txt
          printf '%s\n' "$TAGS" >> image-digest.txt
          {
            echo "## Published image"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-digest-${{ github.sha }}
          path: image-digest.txt
          if-no-files-found: error
          overwrite: true
